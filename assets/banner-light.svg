      <text x="1954" y="326" textLength="1954" lengthAdjust="spacing" font-family="&quot;JetBrains Mono&quot;, ui-monospace, &quot;DejaVu Sans Mono&quot;, Consolas, monospace" font-size="16" font-weight="500" fill="#31483f">TYPESCRIPT   ·   NEXT.JS   ·   REACT   ·   ELECTRON   ·   PYTHON   ·   RUST   ·   KOTLIN   ·   QT 6   ·   POSTGRESQL   ·   FFMPEG   ·   HERMES AGENT   ·   DEEPSEEK   ·   CACHYOS   ·   NEOVIM   ·   </text>
