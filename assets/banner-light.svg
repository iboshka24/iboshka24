        <animate attributeName="width" dur="20s" repeatCount="indefinite" begin="0s" calcMode="spline" values="0;0;390;390;0;0" keyTimes="0;0.750;0.870;0.992;0.998;1" keySplines="0 0 1 1;0.16 0.84 0.24 1;0 0 1 1;0.4 0 1 1;0 0 1 1"/>
      </rect>
