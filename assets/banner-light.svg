<svg xmlns="http://www.w3.org/2000/svg" width="960" height="348" viewBox="0 0 960 348" role="img" aria-labelledby="title desc">
  <title id="title">iboshka24 — AI developer in Tashkent</title>
  <desc id="desc">Header. The line is typed with SMIL so it animates inside an image on GitHub: tools I miss; colleagues, not autocomplete; 287K+ questions in the bank; agents, working as one.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#e4dccf" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f6e62" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0f6e62" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0f6e62" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c2410c" stop-opacity="1"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
