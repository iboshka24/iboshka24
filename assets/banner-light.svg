      </rect>
    </clipPath>
    <clipPath id="clip1">
      <rect x="48" y="176" height="40" width="470">
        <animate attributeName="width" dur="20s" repeatCount="indefinite" begin="0s" calcMode="spline" values="0;0;470;470;0;0" keyTimes="0;0.250;0.370;0.492;0.508;1" keySplines="0 0 1 1;0.16 0.84 0.24 1;0 0 1 1;0.4 0 1 1;0 0 1 1"/>
      </rect>
    </clipPath>
    <clipPath id="clip2">
      <rect x="48" y="176" height="40" width="456">
        <animate attributeName="width" dur="20s" repeatCount="indefinite" begin="0s" calcMode="spline" values="0;0;456;456;0;0" keyTimes="0;0.500;0.620;0.742;0.758;1" keySplines="0 0 1 1;0.16 0.84 0.24 1;0 0 1 1;0.4 0 1 1;0 0 1 1"/>
