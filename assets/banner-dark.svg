<svg xmlns="http://www.w3.org/2000/svg" width="960" height="348" viewBox="0 0 960 348" role="img" aria-labelledby="title desc">
  <title id="title">iboshka24 — AI developer in Tashkent</title>
  <desc id="desc">Header with a typing line: tools I miss; colleagues, not autocomplete; 35 405 exam questions, 11 903 free; agents, working as one.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#1b2923" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ce1c6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5ce1c6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5ce1c6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a1f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff6a1f" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff6a1f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f1412"/>
      <stop offset="0.07" stop-color="#0f1412" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#0f1412" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f1412"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="frame"><rect width="960" height="348"/></clipPath>
    <style>
      .phrase { opacity: 0; }
      .p0 { opacity: 1; }
      .cover {
        transform-box: fill-box;
        transform-origin: right center;
        transform: scaleX(1);
      }
      .blink { animation: blink 1.08s steps(1) infinite; }
      .scan { animation: sweep 9s cubic-bezier(0.37, 0, 0.63, 1) infinite; }
      .orbA { animation: driftA 18s ease-in-out infinite; }
      .orbB { animation: driftB 22s ease-in-out infinite; }
      .dash { animation: dash 7s linear infinite; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      .run { animation: slide 42s linear infinite; }
      @keyframes blink { 0%, 46% { opacity: 1 } 50%, 100% { opacity: 0 } }
      @keyframes phrase {
        0% { opacity: 0 }
        3% { opacity: 1 }
        21% { opacity: 1 }
        25% { opacity: 0 }
        100% { opacity: 0 }
      }
      @keyframes uncover {
        0% { transform: scaleX(1) }
        14% { transform: scaleX(0) }
        100% { transform: scaleX(0) }
      }
    .k0 { animation: k0 20s 0s cubic-bezier(0.16, 0.84, 0.24, 1) infinite; }
    @keyframes k0 {
      0% { transform: translateX(0); }
      14% { transform: translateX(400px); }
      100% { transform: translateX(400px); }
    }
    .c0 { animation: uncover 20s 0s cubic-bezier(0.16, 0.84, 0.24, 1) infinite; }
    .p0 { animation: phrase 20s 0s linear infinite; }
    .k1 { animation: k1 20s 5s cubic-bezier(0.16, 0.84, 0.24, 1) infinite; }
    @keyframes k1 {
      0% { transform: translateX(0); }
      14% { transform: translateX(470px); }
      100% { transform: translateX(470px); }
    }
    .c1 { animation: uncover 20s 5s cubic-bezier(0.16, 0.84, 0.24, 1) infinite; }
    .p1 { animation: phrase 20s 5s linear infinite; }
    .k2 { animation: k2 20s 10s cubic-bezier(0.16, 0.84, 0.24, 1) infinite; }
    @keyframes k2 {
      0% { transform: translateX(0); }
      14% { transform: translateX(500px); }
      100% { transform: translateX(500px); }
    }
    .c2 { animation: uncover 20s 10s cubic-bezier(0.16, 0.84, 0.24, 1) infinite; }
    .p2 { animation: phrase 20s 10s linear infinite; }
    .k3 { animation: k3 20s 15s cubic-bezier(0.16, 0.84, 0.24, 1) infinite; }
    @keyframes k3 {
      0% { transform: translateX(0); }
      14% { transform: translateX(390px); }
      100% { transform: translateX(390px); }
    }
    .c3 { animation: uncover 20s 15s cubic-bezier(0.16, 0.84, 0.24, 1) infinite; }
    .p3 { animation: phrase 20s 15s linear infinite; }
      @keyframes sweep { from { transform: translateX(-240px) } to { transform: translateX(1040px) } }
      @keyframes driftA { 0%, 100% { transform: translate(0, 0) } 50% { transform: translate(-24px, 16px) } }
      @keyframes driftB { 0%, 100% { transform: translate(0, 0) } 50% { transform: translate(22px, -12px) } }
      @keyframes dash { to { stroke-dashoffset: -900 } }
      @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }
      @keyframes slide { from { transform: translateX(0) } to { transform: translateX(-1954px) } }
      @media (prefers-reduced-motion: reduce) {
        .phrase, .cover, .caretx, .blink, .scan, .orbA, .orbB, .dash, .pulse, .run { animation: none }
        .phrase { opacity: 0 }
        .p0 { opacity: 1 }
        .cover { display: none }
      }
    </style>
