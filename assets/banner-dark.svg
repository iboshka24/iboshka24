    <text x="924" y="269" text-anchor="end" font-family="&quot;JetBrains Mono&quot;, ui-monospace, &quot;DejaVu Sans Mono&quot;, Consolas, monospace" font-size="12.5" fill="#8fa599">CACHYOS · ARCH · HACKINTOSH</text>

